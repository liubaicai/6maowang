version: '3.8'

services:
  app:
    build: .
    container_name: 6maowang-nuxt
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    environment:
      - NODE_ENV=production
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:-change-this-secret-min-32-chars}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/api/stats']
      interval: 30s
      timeout: 10s
      retries: 3
